[project]
name = "airev"
version = "0.1.0"
description = "AI Spend Audit Platform — deterministic, rule-based audit engine for startup AI tool spending"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
